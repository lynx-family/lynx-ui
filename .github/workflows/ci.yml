name: Test
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  merge_group:
    types: [checks_requested]
permissions:
  repository-projects: read
  contents: read
  statuses: read
  pull-requests: read

env:
  CI: 1
  TURBO_TELEMETRY_DISABLED: 1
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  code-style-check:
    name: Code Style Check
    runs-on: lynx-ubuntu-24.04-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
      - name: Code Style Check
        run: |
          pnpm check:mdx
          pnpm dprint check
          pnpm biome check
          pnpm dlx sherif@latest
      - name: Changeset Target Check
        run: pnpm check:changesets
      - name: Changeset Private Target Check
        run: |
          pnpm test:changesets-private
          pnpm check:changesets-private
      - name: Changeset Check
        run: pnpm changeset status --since=origin/main || echo "::warning::Changeset check failed, but continuing execution."
      - name: New Publishable Package Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          pnpm test:new-packages
          pnpm check:new-packages --base "$BASE_SHA"

  check-skills:
    name: Check Skills
    runs-on: lynx-ubuntu-24.04-medium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Skills
        run: |
          pnpm check:skills-references
          pnpm check:skills-eval-definitions

  luna-vars:
    name: LUNA Vars
    needs: build
    uses: ./.github/workflows/common-test.yml
    with:
      runs-on: lynx-ubuntu-24.04-medium
      run: pnpm check:luna-vars

  eslint:
    name: ESLint
    needs: build
    uses: ./.github/workflows/common-test.yml
    with:
      runs-on: lynx-ubuntu-24.04-medium
      run: pnpm eslint . --flag v10_config_lookup_from_file

  check-exports:
    name: Check Exports
    needs: build
    uses: ./.github/workflows/common-test.yml
    with:
      runs-on: lynx-ubuntu-24.04-medium
      run: pnpm check:exports

  check-package-types:
    name: Check Package Types
    needs: build
    uses: ./.github/workflows/common-test.yml
    with:
      runs-on: lynx-ubuntu-24.04-medium
      run: pnpm check:package-types

  test-publish:
    name: Test Publish
    needs: build
    uses: ./.github/workflows/common-test.yml
    secrets: inherit
    with:
      runs-on: lynx-ubuntu-24.04-medium
      run: |
        # Start Verdaccio
        pnpm dlx verdaccio@5 -c tools/verdaccio/config.yaml &

        # Wait for Verdaccio to start
        sleep 10

        printf '\n//localhost:4873/:_authToken="this-is-a-fake-token"\n' >> ~/.npmrc
        pnpm ensure:skills-changeset
        pnpm changeset version --snapshot regression
        node tools/canary-release/snapshot.js
        pnpm --recursive publish --no-git-checks --access public --registry=http://localhost:4873
        PKG_NAME=$(node -p "require('./packages/lynx-ui-button/package.json').name")
        PKG_VERSION=$(node -p "require('./packages/lynx-ui-button/package.json').version")
        PNPM_PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager")
        echo "Testing $PKG_NAME@$PKG_VERSION"
        cd `mktemp -d`
        mkdir smoke-test
        cd smoke-test
        corepack "$PNPM_PACKAGE_MANAGER" init
        echo "registry=http://localhost:4873" > .npmrc
        corepack "$PNPM_PACKAGE_MANAGER" add $PKG_NAME@$PKG_VERSION
         if [ ! -f "node_modules/$PKG_NAME/package.json" ]; then
           echo "Package failed to install"
           exit 1
         fi
         MAIN_FILE=$(node -p "require('./node_modules/$PKG_NAME/package.json').main")
         if [ ! -f "node_modules/$PKG_NAME/$MAIN_FILE" ]; then
            echo "Main file not found: $MAIN_FILE"
            exit 1
         fi
        echo "Smoke test passed for $PKG_NAME"

  test-typos:
    name: Test Typos
    runs-on: lynx-ubuntu-24.04-medium
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@2d0ce569feab1f8752f1dde43cc2f2aa53236e06 # v1.40.0
        with:
          files: .
  test-vitest:
    name: Vitest (${{ matrix.runs-on.name }})
    needs: build
    uses: ./.github/workflows/common-test.yml
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - name: Ubuntu
            label: lynx-ubuntu-24.04-medium
    with:
      runs-on: ${{ matrix.runs-on.label }}
      run: >
        pnpm run test
        --reporter=github-actions
        --reporter=dot
        --reporter=junit
        --outputFile=test-report.junit.xml
        --expect.poll.timeout=5000
        --testTimeout=50000
        --hookTimeout=50000
        --coverage
        --coverage.reporter='json'
        --coverage.reporter='text'
        --no-cache
        --logHeapUsage
        --silent
  done:
    needs:
      - check-skills
      - code-style-check
      - luna-vars
      - check-exports
      - check-package-types
      - eslint
      - test-publish
      - test-typos
      - test-vitest
    if: always()
    runs-on: ubuntu-latest
    name: Done
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
